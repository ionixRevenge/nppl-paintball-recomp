      # --- VU microcode / VIF packets and data ---
      - [0x583B80, data, vu_data]
      # --- SCE libkernel data (incl. kernel-patch code, runs at 0x8007xxxx) ---
      - [0x5AC080, data, main_data]
      # --- rodata for main_text (splat hint: jumptable at 0x708150) ---
      - [0x6081D0, rodata, main_text_rodata]
      # --- Secondary EE code block (only reached via pointers) ---
      - [0x643D00, c, text2]
      # --- Switch tables / rodata ---
      - [0x66C660, rodata, main_rodata]
      - { start: 0x682C00, type: bss, vram: 0x782B80, name: main_bss }

  - [0x682C00]
